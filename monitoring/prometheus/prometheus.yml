# Project: Job Board DevOps

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Prometheus Server Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. cAdvisor (Container Resource Usage: CPU, RAM, Network, Disk I/O)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 3. MySQL Server Metrics (mysqld-exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # 4. Nginx Reverse Proxy (Stub Status via HTTP)
  - job_name: 'nginx'
    metrics_path: '/stub_status'
    static_configs:
      - targets: ['nginx:80']

  # 5. Node.js Web Application Health Metrics
  - job_name: 'webapp'
    metrics_path: '/health'
    static_configs:
      - targets: ['webapp:3000']
