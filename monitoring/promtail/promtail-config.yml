server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Nginx Reverse Proxy Access & Error Logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          env: production
          __path__: /var/log/nginx/*.log

  # 2. Docker Container Logs (Web Application & Backend)
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['container']
        regex: '.*webapp.*'
        target_label: 'job'
        replacement: 'webapp'
      - source_labels: ['container']
        regex: '.*nginx.*'
        target_label: 'job'
        replacement: 'nginx'
