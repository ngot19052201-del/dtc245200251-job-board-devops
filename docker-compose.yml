services:
  # ============================================================================
  # 1. FRONTEND REVERSE PROXY (NGINX)
  # ============================================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jobboard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      webapp:
        condition: service_healthy

  # ============================================================================
  # 2. APPLICATION WEB SERVICE (NODE.JS EXPRESS)
  # ============================================================================
  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: jobboard-webapp
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - cv-uploads:/usr/src/app/public/uploads
    networks:
      - backend_net
      - monitoring_net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 3. DATABASE (MYSQL 8.0) - ISOLATED (NO HOST PORT EXPOSED, ONLY BACKEND_NET)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: jobboard-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 4. DATABASE ADMINISTRATION (PHPMYADMIN)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: jobboard-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    networks:
      - backend_net
      - frontend_net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 5. CONTAINER RESOURCE METRICS (CADVISOR)
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: jobboard-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  # ============================================================================
  # 6. MYSQL EXPORTER FOR PROMETHEUS (BRIDGES BACKEND_NET TO MONITORING_NET)
  # ============================================================================
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: jobboard-mysqld-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/.my.cnf"
    volumes:
      - ./monitoring/mysqld-exporter/.my.cnf:/etc/.my.cnf:ro
    networks:
      - monitoring_net
      - backend_net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 6B. NGINX PROMETHEUS EXPORTER
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: jobboard-nginx-exporter
    restart: unless-stopped
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    networks:
      - monitoring_net
      - frontend_net
    depends_on:
      - nginx

  # ============================================================================
  # 7. METRICS SCRAPER & TSDB (PROMETHEUS)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: jobboard-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring_net
    depends_on:
      - cadvisor
      - mysqld-exporter

  # ============================================================================
  # 8. VISUALIZATION DASHBOARD (GRAFANA)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: jobboard-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Admin@2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring_net
      - frontend_net
    depends_on:
      - prometheus
      - loki

  # ============================================================================
  # 9. LOG AGGREGATION SERVER (LOKI)
  # ============================================================================
  loki:
    image: grafana/loki:latest
    container_name: jobboard-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring_net

  # ============================================================================
  # 10. LOG SHIPPER AGENT (PROMTAIL)
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: jobboard-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - nginx-logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring_net
    depends_on:
      - loki

# ==============================================================================
# THREE ISOLATED NETWORKS (frontend_net, backend_net internal, monitoring_net)
# ==============================================================================
networks:
  frontend_net:
    driver: bridge
    name: frontend_net
  backend_net:
    driver: bridge
    name: backend_net
    internal: true
  monitoring_net:
    driver: bridge
    name: monitoring_net

# ==============================================================================
# PERSISTENT VOLUMES
# ==============================================================================
volumes:
  mysql-data:
  cv-uploads:
  nginx-logs:
  prometheus-data:
  grafana-data:
  loki-data:
