# HTTP Server - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jobboard.local localhost;

    # Allow stub_status internally for Prometheus Nginx exporter
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Reverse Proxy with Enhanced Security Headers
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobboard.local localhost;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;


    # SSL Certificates (Self-signed)
    ssl_certificate /etc/nginx/ssl/jobboard.crt;
    ssl_certificate_key /etc/nginx/ssl/jobboard.key;

    # Hardened SSL/TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Mandatory Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com;" always;

    # Max body size for CV file uploads
    client_max_body_size 10M;

    # Logging format
    access_log /var/log/nginx/jobboard.access.log;
    error_log /var/log/nginx/jobboard.error.log warn;

    # Stub status for Prometheus metrics
    location /stub_status {
        stub_status on;
        access_log off;
        allow all;
    }

    # Proxy Pass to Node.js Web Application
    location / {
        proxy_pass http://webapp:3000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
